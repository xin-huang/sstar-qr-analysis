simulation:
  nrep: 10000
  nref: ?int(wildcards.n_ref)
  ntgt: ?int(wildcards.n_tgt)
  ref_id: ?params.sstar2["ref_id"]
  tgt_id: ?params.sstar2["tgt_id"]
  seq_len: ?params.sstar2["win_len"]
  mut_rate: ?params.sstar2["mut_rate"]
  rec_rate: ?params.sstar2["rec_rate"]
  ploidy: 2
  is_phased: ?params.sstar2["phase_state"]
  nfeature: 100_000
  is_shuffled: False
  nprocess: ?params.sstar2["nprocess"]
  seed: ?params.sstar2["seed"]

preprocessing:
  vcf_file: ?input.vcf
  chr_name: "1"
  ref_ind_file: ?params.sstar2["ref_ind_file"]
  tgt_ind_file: ?params.sstar2["tgt_ind_file"]
  win_len: ?params.sstar2["win_len"]
  win_step: 10000
  is_phased: ?params.sstar2["phase_state"]
  nprocess: ?params.sstar2["nprocess"]
  ploidy: 2

model:
  params:
    loss: "quantile"
    alpha: ?float(wildcards.quantile)
    n_estimators: 200
    max_depth: 3
    random_state: ?params.sstar2["seed"]
